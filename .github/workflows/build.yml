name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev wget
      - name: Install buildozer
        run: pip install buildozer cython
      - name: Install Android SDK (build-tools)
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          wget -q --show-progress https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          if [ ! -f cmdline-tools.zip ]; then echo "❌ Download failed"; exit 1; fi
          unzip -q cmdline-tools.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools/* android-sdk/cmdline-tools/
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/bin
          # Принимаем лицензии (echo y вместо yes)
          echo y | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;30.0.3" "platforms;android-30"
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HotspotSecure
          path: bin/*.apk
